name: Publicar edição do Attlas

# A rotina semanal escreve a edição num branch claude/* e para ali. Este workflow leva a
# edição até a main sem ninguém precisar mesclar o PR: mescla, roda o pipeline da edição
# (scripts/pipeline-edicao.sh: dados, fotos, build, visual) e dá push, já com as fotos.
# A Vercel publica a partir da main. Se algo falhar, a main não muda e o job fica vermelho.
#
# - push num branch claude/*: publica a edição que acabou de chegar.
# - todo dia 12:17 UTC (e à mão): varre todos os branches claude/* atrás de edição esquecida.

on:
  push:
    branches: ['claude/**']
  schedule:
    - cron: '17 12 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publicar-attlas
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      # Etapa 2 do pipeline (fotos): busca e abre a og:image de cada matéria.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Dependências das fotos
        run: pip install --quiet requests beautifulsoup4 pillow

      # Etapa 4 do pipeline (visual): Chromium fora do package.json, para não pesar na Vercel.
      - name: Chromium para a validação visual
        run: |
          npm install --silent --no-save --prefix "$RUNNER_TEMP/pw" playwright@1.56.1
          npx --prefix "$RUNNER_TEMP/pw" playwright install --with-deps chromium
          echo "NODE_PATH=$RUNNER_TEMP/pw/node_modules" >> "$GITHUB_ENV"

      - name: Publicar na main
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          # O script troca de branch durante a execução; roda de uma cópia fora da árvore.
          cp scripts/publicar-edicoes.sh "$RUNNER_TEMP/publicar-edicoes.sh"
          if [ "${{ github.event_name }}" = push ]; then
            bash "$RUNNER_TEMP/publicar-edicoes.sh" "${{ github.ref_name }}"
          else
            bash "$RUNNER_TEMP/publicar-edicoes.sh"
          fi
